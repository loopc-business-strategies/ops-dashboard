plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.loopc.mgfloor'
version = '1.0.0'

android {
  namespace "expo.modules.scaleocr"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Bundled on-device Latin recognizer — works offline, no Play Services model download.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
