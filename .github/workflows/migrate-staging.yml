name: Staging migration

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply pending migrations (requires Atlas backup + confirm token). Default false = dry-run only.
        required: false
        type: boolean
        default: false
      until:
        description: Stop after this migration id. Use 002 to skip JV 003; use 008 for hardening indexes.
        required: false
        type: string
        default: '002-backfill-mapping-departments'
      tenants:
        description: Comma-separated tenants (default all staging). Example mg,cg,loopc or vb.
        required: false
        type: string
        default: ''
      skip:
        description: Comma-separated migration ids to record-skip on apply (e.g. 003-backfill-jv-ledger-base-to-fc).
        required: false
        type: string
        default: ''

concurrency:
  group: migrate-staging-${{ github.event.inputs.until || '002' }}-${{ github.event.inputs.apply || 'dry' }}-${{ github.event.inputs.tenants || 'all' }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Staging migration dry-run/apply
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Require staging Mongo secrets
        env:
          STAGING_MONGO_URI_MG: ${{ secrets.STAGING_MONGO_URI_MG }}
          STAGING_MONGO_URI_CG: ${{ secrets.STAGING_MONGO_URI_CG }}
          STAGING_MONGO_URI_LOOPC: ${{ secrets.STAGING_MONGO_URI_LOOPC }}
          STAGING_MONGO_URI_VB: ${{ secrets.STAGING_MONGO_URI_VB }}
        run: |
          missing=0
          for key in STAGING_MONGO_URI_MG STAGING_MONGO_URI_CG STAGING_MONGO_URI_LOOPC STAGING_MONGO_URI_VB; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing migration: staging Mongo secrets are required. Do not fall back to production URIs."
            exit 1
          fi

      - name: Refuse apply of JV migration 003 as until target
        if: ${{ inputs.apply == true && inputs.until == '003-backfill-jv-ledger-base-to-fc' }}
        run: |
          echo "::error::Refusing apply of 003-backfill-jv-ledger-base-to-fc (mutates JV ledger). Use dedicated reviewed process."
          exit 1

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build migrate args
        id: args
        run: |
          EXTRA=""
          if [ -n "${{ inputs.tenants }}" ]; then EXTRA="$EXTRA --tenants=${{ inputs.tenants }}"; fi
          if [ -n "${{ inputs.skip }}" ]; then EXTRA="$EXTRA --skip=${{ inputs.skip }}"; fi
          echo "extra=$EXTRA" >> "$GITHUB_OUTPUT"

      - name: Dry-run staging migrations
        if: ${{ inputs.apply != true }}
        env:
          APP_ENV: staging
          STAGING_MONGO_URI_MG: ${{ secrets.STAGING_MONGO_URI_MG }}
          STAGING_MONGO_URI_CG: ${{ secrets.STAGING_MONGO_URI_CG }}
          STAGING_MONGO_URI_LOOPC: ${{ secrets.STAGING_MONGO_URI_LOOPC }}
          STAGING_MONGO_URI_VB: ${{ secrets.STAGING_MONGO_URI_VB }}
        run: node scripts/migrate-staging.mjs --until=${{ inputs.until }} ${{ steps.args.outputs.extra }}

      - name: Guard — refuse apply if JV 003 still pending without --skip
        if: ${{ inputs.apply == true && inputs.until != '002-backfill-mapping-departments' && inputs.until != '001-baseline' }}
        env:
          APP_ENV: staging
          STAGING_MONGO_URI_MG: ${{ secrets.STAGING_MONGO_URI_MG }}
          STAGING_MONGO_URI_CG: ${{ secrets.STAGING_MONGO_URI_CG }}
          STAGING_MONGO_URI_LOOPC: ${{ secrets.STAGING_MONGO_URI_LOOPC }}
          STAGING_MONGO_URI_VB: ${{ secrets.STAGING_MONGO_URI_VB }}
        run: |
          set -o pipefail
          SKIP_CSV="${{ inputs.skip }}"
          OUT=$(node scripts/migrate-staging.mjs --until=${{ inputs.until }} ${{ steps.args.outputs.extra }} 2>&1 | tee /dev/stderr)
          if echo "$OUT" | grep -E 'pending:.*003-backfill-jv-ledger-base-to-fc' >/dev/null; then
            case ",${SKIP_CSV}," in
              *,003-backfill-jv-ledger-base-to-fc,*)
                echo "003 is pending but listed in --skip; will record-skip (not execute)."
                ;;
              *)
                echo "::error::003-backfill-jv-ledger-base-to-fc is still pending. Pass skip=003-backfill-jv-ledger-base-to-fc or stop before 003."
                exit 1
                ;;
            esac
          fi

      - name: Apply staging migrations
        if: ${{ inputs.apply == true }}
        env:
          APP_ENV: staging
          STAGING_MONGO_URI_MG: ${{ secrets.STAGING_MONGO_URI_MG }}
          STAGING_MONGO_URI_CG: ${{ secrets.STAGING_MONGO_URI_CG }}
          STAGING_MONGO_URI_LOOPC: ${{ secrets.STAGING_MONGO_URI_LOOPC }}
          STAGING_MONGO_URI_VB: ${{ secrets.STAGING_MONGO_URI_VB }}
          MIGRATION_I_HAVE_BACKUP: 'true'
          MIGRATION_CONFIRM_TOKEN: ${{ secrets.MIGRATION_CONFIRM_TOKEN }}
        run: node scripts/migrate-staging.mjs --until=${{ inputs.until }} --apply --confirm=${{ secrets.MIGRATION_CONFIRM_TOKEN }} ${{ steps.args.outputs.extra }}
