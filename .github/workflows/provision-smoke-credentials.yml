name: Provision Smoke Credentials (staging only)

# Production smoke-user provisioning is retired. This workflow only provisions
# staging probe users via STAGING_MONGO_URI_* + --staging.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'provision (reset password + upsert) or reactivate (isActive only)'
        required: false
        default: 'provision'
        type: choice
        options:
          - provision
          - reactivate

concurrency:
  group: provision-smoke-credentials-staging-only
  cancel-in-progress: true

jobs:
  provision:
    name: Create staging smoke users (staging-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Require staging Mongo secrets
        env:
          STAGING_MONGO_URI_MG: ${{ secrets.STAGING_MONGO_URI_MG }}
          STAGING_MONGO_URI_CG: ${{ secrets.STAGING_MONGO_URI_CG }}
          STAGING_MONGO_URI_LOOPC: ${{ secrets.STAGING_MONGO_URI_LOOPC }}
        run: |
          missing=0
          for key in STAGING_MONGO_URI_MG STAGING_MONGO_URI_CG STAGING_MONGO_URI_LOOPC; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing: production smoke provisioning is disabled. Use staging secrets only."
            exit 1
          fi

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Provision staging smoke users
        env:
          APP_ENV: staging
          STAGING_MONGO_URI_MG: ${{ secrets.STAGING_MONGO_URI_MG }}
          STAGING_MONGO_URI_CG: ${{ secrets.STAGING_MONGO_URI_CG }}
          STAGING_MONGO_URI_LOOPC: ${{ secrets.STAGING_MONGO_URI_LOOPC }}
          SMOKE_AUTH_NAME: ${{ secrets.STAGING_SMOKE_AUTH_NAME }}
          SMOKE_AUTH_PASSWORD: ${{ secrets.STAGING_SMOKE_AUTH_PASSWORD }}
          SMOKE_API_BASE: ${{ vars.STAGING_SMOKE_API_BASE || 'https://ops-dashboard-staging-e6c6.up.railway.app' }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "reactivate" ]; then
            node scripts/setup-smoke-github-secrets.js --staging --reactivate-only --skip-verify
          else
            node scripts/setup-smoke-github-secrets.js --staging --users-only --skip-verify
          fi
